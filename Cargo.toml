[package]
name = "rust-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
worker = { version = "0.7.2", features = ["d1", "queue"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.100"
regex = "1.0"
urlencoding = "2.1"

[dev-dependencies]
